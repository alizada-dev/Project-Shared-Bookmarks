<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script type="module" src="script.js"></script>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <!-- Bookmark Template -->
    <template id="bookmark-template">
      <article>
        <h3>
          <a class="bookmark-url" href="#" target="_blank"></a>
        </h3>

        <p class="description"></p>
        <p class="time-created"></p>
      
        <p class="like-count">Likes: 0</p>

        <button class="copyBtn">Copy to Clipboard</button>
        <button class="likeBtn">Like</button>
        <button class="deleteBtn">Delete</button>
      </article>
    </template>

    <main class="container">
      <h1>Welcome to the Shared Bookmarks!</h1>

      <div class="dropdown">
        <label for="user">Select a user to see their saved bookmarks:</label>

        <select class="select" id="user">
          <option value="" selected disabled>
            Select one of the following users
          </option>
        </select>
      </div>

      <!-- Container for displaying bookmarks -->
      <div class="bookmarks-container"></div>

      <p class="message"></p>

      <!-- Bookmark form to add new bookmarks -->
      <form action="" id="bookmarks-form">
        <h2>Add a new bookmark</h2>

        <label for="title">Site title</label>
        <input type="text" id="title" required>

        <label for="desc">Description</label>
        <input type="text" id="desc" required>

        <label for="url">Site URL</label>
        <input type="url" id="url" required>

        <button type="submit" id="submit-btn">Submit</button>
      </form>

    </main>

  </body>
</html>
